name: Update Benchmark Baseline
on:
  push:
    branches: [ main ]
    paths: [ '**/*.go', 'go.mod', 'go.sum' ]
permissions: { contents: write }
jobs:
  check-branch:
    if: vars.DISABLE_BENCHMARKS != 'true'
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - name: Check if gh-pages exists
        id: check
        run: |
          if git ls-remote --exit-code --heads https://github.com/${{ github.repository }}.git gh-pages; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  benchmark-main:
    needs: check-branch
    if: needs.check-branch.outputs.exists == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.22' }
      - name: Start Valkey
        run: |
          docker compose up -d valkey
          until docker compose exec -T valkey valkey-cli ping | grep -q PONG; do
            echo "Waiting for Valkey..."
            sleep 1
          done
      - name: Run Main Benchmarks
        run: go test -bench=. -run=^$ -benchmem -count=10 ./... | tee out.txt
      - name: Average Results
        if: always()
        run: |
          awk '/^Benchmark/ { count[$1]++; time[$1]+=$3; bytes[$1]+=$5; allocs[$1]+=$7; iters[$1]=$2 } END { for (b in count) printf "%s %d %.2f ns/op %d B/op %d allocs/op\n", b, iters[b], time[b]/count[b], bytes[b]/count[b], allocs[b]/count[b] }' out.txt > averaged.txt
      - name: Teardown Valkey
        if: always()
        run: docker compose down -v
      - name: Update gh-pages Baseline
        if: success() || failure()
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: 'go'
          output-file-path: averaged.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
